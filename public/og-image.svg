<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#081024" />
      <stop offset="100%" stop-color="#0D1633" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 160) rotate(35) scale(480 340)">
      <stop stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 470) rotate(-20) scale(500 360)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="80" y1="220" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="cardStroke" x1="720" y1="120" x2="1120" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#glowViolet)" />

  <!-- Subtle Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand badge -->
  <rect x="80" y="92" width="320" height="42" rx="21" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.35" />
  <circle cx="106" cy="113" r="6" fill="#22D3EE" />
  <text x="124" y="119" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.04em">COMPUTER VISION ATTENDANCE</text>

  <!-- Title -->
  <text x="80" y="232" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="-0.03em">ExamLens</text>
  <text x="80" y="302" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.01em">Smarter Examination Attendance.</text>
  <text x="80" y="346" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.01em">Powered by AI.</text>

  <text x="80" y="416" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">Guided enrollment, InsightFace facial matching, local SQLite</text>
  <text x="80" y="448" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">attendance logging, and Electron organizer tooling.</text>

  <!-- Stack pills -->
  <g font-family="ui-monospace, monospace" font-size="15" fill="#E2E8F0">
    <rect x="80" y="494" width="118" height="38" rx="10" fill="#111C38" stroke="#334155" />
    <text x="102" y="518">InsightFace</text>
    <rect x="210" y="494" width="98" height="38" rx="10" fill="#111C38" stroke="#334155" />
    <text x="230" y="518">FastAPI</text>
    <rect x="320" y="494" width="102" height="38" rx="10" fill="#111C38" stroke="#334155" />
    <text x="340" y="518">Electron</text>
    <rect x="434" y="494" width="98" height="38" rx="10" fill="#111C38" stroke="#334155" />
    <text x="455" y="518">Next.js</text>
    <rect x="544" y="494" width="108" height="38" rx="10" fill="#111C38" stroke="#334155" />
    <text x="562" y="518">Supabase</text>
  </g>

  <!-- Illustrative Scanner Card -->
  <rect x="736" y="108" width="384" height="414" rx="26" fill="#0B132B" fill-opacity="0.92" stroke="url(#cardStroke)" stroke-width="2" />
  <rect x="764" y="136" width="328" height="36" rx="10" fill="#111C38" />
  <circle cx="784" cy="154" r="5" fill="#22D3EE" />
  <text x="798" y="159" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="13">SAMPLE PREVIEW • CS101 HALL A</text>

  <!-- Reticle -->
  <path d="M846 232V206H872" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" />
  <path d="M1010 206H984M1010 206V232" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" />
  <path d="M846 344V370H872" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" />
  <path d="M1010 344V370H984" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="928" cy="272" r="34" stroke="#60A5FA" stroke-width="3" />
  <path d="M878 344C890 322 907 312 928 312C949 312 966 322 978 344" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />

  <!-- Status footer inside card -->
  <rect x="764" y="402" width="328" height="92" rx="14" fill="#111C38" stroke="#1E293B" />
  <text x="784" y="432" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Sample Candidate (Fictional)</text>
  <text x="784" y="456" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">UGS-26-001 • ELIGIBLE • LOCAL DB</text>
  <rect x="784" y="468" width="142" height="14" rx="7" fill="#064E3B" />
  <circle cx="793" cy="475" r="3.5" fill="#34D399" />
  <text x="803" y="479" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="10" font-weight="700">MARKED PRESENT</text>
</svg>
